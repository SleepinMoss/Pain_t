name: Build Pain_t

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13
          - macos-14

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow pyinstaller

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --windowed --collect-all PIL --icon=assets/icon.png --add-data "assets:assets" pain_t.py

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --collect-all PIL --icon=assets/icon.ico --add-data "assets;assets" pain_t.py

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --windowed --collect-all PIL --icon=assets/icon.icns --add-data "assets:assets" pain_t.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pain_t-${{ runner.os }}
          path: dist/*
